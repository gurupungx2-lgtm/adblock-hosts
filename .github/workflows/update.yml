name: Update hosts weekly
on:
  schedule:
    - cron: "17 3 * * 1"     # every Monday 03:17 UTC (10:17 Bangkok)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if list unchanged"
        default: "0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build module
        run: FORCE="${{ github.event.inputs.force || '0' }}" ./build.sh
      - name: Commit if changed
        run: |
          git config user.name "adblock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A dist CHANGELOG.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: $(grep -m1 '"version"' dist/update.json | tr -d ' ,"' | cut -d: -f2) — $(sed -n 2p CHANGELOG.md)"
          git push
